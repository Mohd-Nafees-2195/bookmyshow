
services:
  postgres:
    image: postgres:16
    container_name: bookmyshow_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Abcd@1234
      POSTGRES_DB: bookmyshow
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data


volumes:
  pgdata: